<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Nursery and Seed Management System</title>
    <link rel="stylesheet" href="inventory.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div id="main">
       <div class="dashboard-container">
            <aside class="sidebar">
                <div class="profile">
                    <h3>Admin</h3>
                </div>
                <nav>
                    <ul>
                        <li>
                            <a href="dashboard.html" style="text-decoration: none; color: inherit;">
                                <i class="fas fa-seedling"></i> Overview
                            </a>
                        </li>
                        <li><i class="fas fa-seedling"></i> Inventory</li>

                        <li><i class="fas fa-shopping-cart"></i> Orders</li>
                        <li><i class="fas fa-users"></i> Customers</li>
                        <li><i class="fas fa-cog"></i> Settings</li>
                    </ul>
                </nav>
            </aside>

    <main class="main-content">
        <header class="inventory-header-top">
            <h2>Inventory Management</h2>
            <div class="user-info">
                <span>Welcome, Sujeet</span>
            </div>
        </header>

        <section class="inventory-card">
            <div class="table-controls">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="inventorySearch" placeholder="Search stock...">
                </div>
                <button class="btn-primary">+ Add New Item</button>
            </div>

            <div class="table-wrapper">
                <table class="inventory-table">
                    <thead>
                        <tr>
                            <th>Item ID</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Stock</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#NS-001</td>
                            <td>Organic Rose Seeds</td>
                            <td>Seeds</td>
                            <td>150 Units</td>
                            <td>₹120</td>
                            <td><span class="status-badge available">In Stock</span></td>
                            <td><i class="fas fa-edit edit-icon"></i> <i class="fas fa-trash delete-icon"></i></td>
                        </tr>
                        <tr>
                            <td>#NP-045</td>
                            <td>Aloe Vera Plant</td>
                            <td>Indoor</td>
                            <td>08 Units</td>
                            <td>₹250</td>
                            <td><span class="status-badge low">Low Stock</span></td>
                            <td><i class="fas fa-edit edit-icon"></i> <i class="fas fa-trash delete-icon"></i></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
    </div>
    
</body>
</html>
