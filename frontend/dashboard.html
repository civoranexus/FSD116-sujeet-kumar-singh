<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nursery and Seed Management System</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div id="main">
        <div class="dashboard-container">
            <aside class="sidebar">
                <div class="profile">
                    <h3>Admin</h3>
                </div>
                <nav>
                    <ul>
                        <li><i class="fas fa-th-large"></i> Overview</li>
                        <li>
                            <a href="inventory.html" style="text-decoration: none; color: inherit;">
                                <i class="fas fa-seedling"></i> Inventory
                            </a>
                        </li>
                        <li><i class="fas fa-shopping-cart"></i> Orders</li>
                        <li><i class="fas fa-users"></i> Customers</li>
                        <li><i class="fas fa-cog"></i> Settings</li>
                    </ul>
                </nav>
            </aside>

            <main class="main-content">
                <header class="dash-header">
                    <h2>Welcome Back, Sujeet!</h2>
                    <div class="search-bar">
                        <input type="text" placeholder="Search seeds, plants...">
                    </div>
                </header>

                <section class="stats-grid">
                    <div class="stat-card">
                        <div class="icon-box green"><i class="fas fa-leaf"></i></div>
                        <div>
                            <p>Total Plants</p>
                            <h3>1,240</h3>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="icon-box blue"><i class="fas fa-box"></i></div>
                        <div>
                            <p>Seed Packets</p>
                            <h3>4,500</h3>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="icon-box orange"><i class="fas fa-truck"></i></div>
                        <div>
                            <p>Pending Orders</p>
                            <h3>12</h3>
                        </div>
                    </div>
                </section>

                <section class="recent-section">
                    <h3>Recent Stock Updates</h3>
                    <table class="styled-table">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Marigold Seeds</td>
                                <td>Flowers</td>
                                <td>500</td>
                                <td><span class="badge in-stock">In Stock</span></td>
                            </tr>
                            <tr>
                                <td>Aloe Vera</td>
                                <td>Medicinal</td>
                                <td>5</td>
                                <td><span class="badge low-stock">Low Stock</span></td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
