<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement | Nursery Management</title>
    <link rel="stylesheet" href="Procurement.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h2>New Procurement Entry</h2>
            <form id="procurementForm">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" placeholder="e.g. Tomato Seeds" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Category</label>
                        <select>
                            <option>Seeds</option>
                            <option>Plants</option>
                            <option>Fertilizer</option>
                            <option>Tools</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="qty" placeholder="0" required>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Unit Price (₹)</label>
                        <input type="number" id="price" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>Supplier Name</label>
                        <input type="text" placeholder="Supplier details" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Purchase Date</label>
                    <input type="date">
                </div>

                <button type="submit" class="btn">Add to Inventory</button>
            </form>
        </div>
    </div>
</body>
</html>
