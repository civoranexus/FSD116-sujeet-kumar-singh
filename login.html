<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Role Login - Nursery System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <div id="login-container">
        <div id="login-card">
            <div class="login-header">
                <img src="logo.png" alt="Nursery Logo">
                <h2>Portal Login</h2>
                <p>Select your role to access the system</p>
            </div>
            <form id="multi-role-form">
                <div class="input-group">
                    <i class="ri-user-settings-line"></i>
                    <select id="user-role" required>
                        <option value="" disabled selected>Select Your Role</option>
                        <option value="admin">Administrator</option>
                        <option value="staff">Staff Member</option>
                        <option value="customer">Customer</option>
                    </select>
                </div>

                <div class="input-group">
                    <i class="ri-mail-line"></i>
                    <input type="email" placeholder="Username or Email" required>
                </div>

                <div class="input-group">
                    <i class="ri-lock-line"></i>
                    <input type="password" placeholder="Password" required>
                </div>

                <div class="form-options">
                        <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn">Secure Login</button>
            </form>

            <div class="login-footer">
                <p>New Customer? <a href="#">Create Account</a></p>
                <p><a href="index.html">Back to Home</a></p>
            </div>
        </div>
    </div>
    <script src="logo.js"></script>
</body>
</html>
